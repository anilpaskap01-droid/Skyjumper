name: Build Auto APK Hub APK

on:
  push:
    branches:
      - auto-apk-hub-build
    paths:
      - 'auto_apk_hub_src/**'
      - '.github/workflows/auto-apk-hub.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Create clean Flutter Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/auto_apk_hub_build
          mkdir -p /tmp/auto_apk_hub_build
          cd /tmp/auto_apk_hub_build
          flutter create --platforms=android --org com.onpa --project-name auto_apk_hub .

          cp "$GITHUB_WORKSPACE/auto_apk_hub_src/pubspec.yaml" pubspec.yaml
          cp "$GITHUB_WORKSPACE/auto_apk_hub_src/lib/main.dart" lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          if "import 'dart:async';" not in s:
              s = "import 'dart:async';\n" + s
          p.write_text(s, encoding='utf-8')
          PY

          mkdir -p android/app/src/main/kotlin/com/onpa/auto_apk_hub
          cp "$GITHUB_WORKSPACE/auto_apk_hub_src/android/MainActivity.kt" \
            android/app/src/main/kotlin/com/onpa/auto_apk_hub/MainActivity.kt
          cp "$GITHUB_WORKSPACE/auto_apk_hub_src/android/AndroidManifest.xml" \
            android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp "$GITHUB_WORKSPACE/auto_apk_hub_src/android/file_paths.xml" \
            android/app/src/main/res/xml/file_paths.xml

      - name: Get Flutter packages
        working-directory: /tmp/auto_apk_hub_build
        run: flutter pub get

      - name: Build release APK for ARM64
        working-directory: /tmp/auto_apk_hub_build
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        shell: bash
        run: |
          cp /tmp/auto_apk_hub_build/build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/AutoAPKHub-v1.0-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/AutoAPKHub-v1.0-arm64.apk" > \
             "$GITHUB_WORKSPACE/AutoAPKHub-v1.0-arm64.sha256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAPKHub-v1.0-arm64
          path: |
            AutoAPKHub-v1.0-arm64.apk
            AutoAPKHub-v1.0-arm64.sha256.txt
          if-no-files-found: error
          retention-days: 7
