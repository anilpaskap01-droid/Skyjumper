name: SkyJumper Android CI

on:
  push:
    branches: [main, skyjumper-local-complete]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify embedded original APK skin atlas
        run: |
          set -euo pipefail
          test -s assets/original_skin_atlas.webp
          file assets/original_skin_atlas.webp | grep -qi webp
          if grep -RniE 'CustomPaint\(|CustomPainter' lib/widgets/skin_avatar.dart; then
            echo 'Procedural skin renderer found; only original APK pixels are allowed.'
            exit 1
          fi
          if grep -RniE 'Image\.network|NetworkImage' lib/widgets/skin_avatar.dart lib/features/shop; then
            echo 'Network skin renderer found; skin art must be bundled from the original APK.'
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --org com.hantro --project-name skyjumper .
          rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify forbidden SDK dependencies are absent
        run: |
          if grep -RniE 'package:(firebase|google_mobile_ads|in_app_purchase)|firebase_core:|firebase_auth:|cloud_firestore:|google_mobile_ads:|in_app_purchase:|purchases_flutter:' lib pubspec.yaml; then
            echo 'Forbidden SDK dependency reference found.'
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skyjumper-real-skins-visible-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
