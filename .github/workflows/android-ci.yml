name: SkyJumper Android CI

on:
  push:
    branches: [main, skyjumper-local-complete]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --org com.hantro --project-name skyjumper .
          rm -f test/widget_test.dart

      - name: Enable GitHub skin image access only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              if marker not in text:
                  raise SystemExit('Android manifest marker not found')
              text = text.replace(marker, marker + '\n' + permission, 1)
          path.write_text(text)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify forbidden SDK dependencies are absent
        run: |
          if grep -RniE 'package:(firebase|google_mobile_ads|in_app_purchase)|firebase_core:|firebase_auth:|cloud_firestore:|google_mobile_ads:|in_app_purchase:|purchases_flutter:' lib pubspec.yaml; then
            echo 'Forbidden SDK dependency reference found.'
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skyjumper-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
