name: SkyJumper Android CI

on:
  push:
    branches: [main, skyjumper-local-complete]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact original APK skin art
        run: |
          set -euo pipefail
          rm -rf assets/original_skins
          mkdir -p assets/original_skins /tmp/skyjumper-apk
          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36' \
            'https://d.apkpure.com/b/APK/com.hantro.skyjumper?version=latest' \
            -o /tmp/skyjumper-apk/download.bin
          python3 - <<'PY'
          import io
          import os
          import shutil
          import zipfile

          source = '/tmp/skyjumper-apk/download.bin'
          expected = ['classic', 'glacier', 'magma', 'neon', 'aurora', 'blaze', 'void'] + [f'custom_slot_{i:02d}' for i in range(1, 31)]
          prefix = 'assets/flutter_assets/assets/skins/'

          def open_apk(path):
              outer = zipfile.ZipFile(path)
              if any(n.startswith(prefix) for n in outer.namelist()):
                  return outer
              inner_apks = [n for n in outer.namelist() if n.lower().endswith('.apk')]
              if not inner_apks:
                  raise SystemExit('Downloaded package is neither the SkyJumper APK nor an XAPK containing an APK')
              data = outer.read(inner_apks[0])
              outer.close()
              return zipfile.ZipFile(io.BytesIO(data))

          with open_apk(source) as apk:
              missing = []
              written = 0
              for skin_id in expected:
                  for pose in ('front_idle', 'front_jump'):
                      src = f'{prefix}{skin_id}/{pose}.png'
                      if src not in apk.namelist():
                          missing.append(src)
                          continue
                      dst = f'assets/original_skins/{skin_id}_{pose}.png'
                      with apk.open(src) as inp, open(dst, 'wb') as out:
                          shutil.copyfileobj(inp, out)
                      written += 1
              if missing:
                  raise SystemExit('Original APK is missing required real skin assets:\n' + '\n'.join(missing))
              if written != 74:
                  raise SystemExit(f'Expected 74 original skin images, wrote {written}')

          print('Restored 74 exact original SkyJumper skin pose PNGs.')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --org com.hantro --project-name skyjumper .
          rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify forbidden SDK dependencies are absent
        run: |
          if grep -RniE 'package:(firebase|google_mobile_ads|in_app_purchase)|firebase_core:|firebase_auth:|cloud_firestore:|google_mobile_ads:|in_app_purchase:|purchases_flutter:' lib pubspec.yaml; then
            echo 'Forbidden SDK dependency reference found.'
            exit 1
          fi

      - name: Verify no procedural skin renderer remains
        run: |
          if grep -RniE 'CustomPaint\(|CustomPainter' lib/widgets/skin_avatar.dart; then
            echo 'Procedural skin renderer found; only original APK image assets are allowed.'
            exit 1
          fi
          test "$(find assets/original_skins -type f -name '*.png' | wc -l)" -eq 74

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skyjumper-original-skins-unlimited-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
