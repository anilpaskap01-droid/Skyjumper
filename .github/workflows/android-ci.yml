name: SkyJumper Android CI

on:
  push:
    branches: [main, skyjumper-local-complete]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify custom photo skins
        run: |
          set -euo pipefail
          test -s assets/custom_skins/custom_slot_29.webp
          test -s assets/custom_skins/custom_slot_30.webp
          file assets/custom_skins/custom_slot_29.webp | grep -qi webp
          file assets/custom_skins/custom_slot_30.webp | grep -qi webp

      - name: Verify embedded original APK skin atlas
        run: |
          set -euo pipefail
          test -s assets/original_skin_atlas.webp
          file assets/original_skin_atlas.webp | grep -qi webp
          if grep -RniE 'CustomPaint\(|CustomPainter' lib/widgets/skin_avatar.dart; then
            echo 'Procedural skin renderer found; only bundled skin pixels are allowed.'
            exit 1
          fi
          if grep -RniE 'Image\.network|NetworkImage' lib/widgets/skin_avatar.dart lib/features/shop; then
            echo 'Network skin renderer found; skin art must be bundled locally.'
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --org com.hantro --project-name skyjumper .
          rm -f test/widget_test.dart

      - name: Configure private Android identity
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.hantro.skyjumper"/applicationId = "com.hantro.skyjumper.private"/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 29/' android/app/build.gradle.kts
            cat >> android/app/build.gradle.kts <<'EOF'

          android {
              lint {
                  disable += "ExpiredTargetSdkVersion"
                  checkReleaseBuilds = false
              }
          }
          EOF
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId ['\"]com.hantro.skyjumper['\"]/applicationId 'com.hantro.skyjumper.private'/" android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 29/' android/app/build.gradle
            cat >> android/app/build.gradle <<'EOF'

          android {
              lintOptions {
                  disable 'ExpiredTargetSdkVersion'
                  checkReleaseBuilds false
              }
          }
          EOF
          fi
          sed -i 's/android:label="skyjumper"/android:label="SkyJumper Private"/' android/app/src/main/AndroidManifest.xml
          grep -R "com.hantro.skyjumper.private" android/app/build.gradle* || (echo 'Private applicationId not applied' && exit 1)
          grep -R "targetSdk = 29\|targetSdkVersion 29" android/app/build.gradle* || (echo 'Target SDK 29 not applied' && exit 1)
          grep -q 'android:label="SkyJumper Private"' android/app/src/main/AndroidManifest.xml || (echo 'Private app label not applied' && exit 1)

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify forbidden SDK dependencies are absent
        run: |
          if grep -RniE 'package:(firebase|google_mobile_ads|in_app_purchase)|firebase_core:|firebase_auth:|cloud_firestore:|google_mobile_ads:|in_app_purchase:|purchases_flutter:' lib pubspec.yaml; then
            echo 'Forbidden SDK dependency reference found.'
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skyjumper-private-real-assets-base
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
