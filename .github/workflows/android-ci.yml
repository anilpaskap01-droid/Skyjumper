name: SkyJumper Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: |
          flutter create --platforms=android --org com.hantro --project-name skyjumper .
          rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/gameplay_engine_test.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skyjumper-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
