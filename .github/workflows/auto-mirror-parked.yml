name: Build AutoMirror Parked APK

on:
  push:
    branches:
      - auto-apk-hub-build
    paths:
      - 'auto_mirror_src/**'
      - '.github/workflows/auto-mirror-parked.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Create clean Flutter Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/auto_mirror_build
          mkdir -p /tmp/auto_mirror_build
          cd /tmp/auto_mirror_build
          flutter create --platforms=android --org com.onpa --project-name auto_mirror_parked .

          cp "$GITHUB_WORKSPACE/auto_mirror_src/pubspec.yaml" pubspec.yaml
          cp "$GITHUB_WORKSPACE/auto_mirror_src/lib/main.dart" lib/main.dart

          mkdir -p android/app/src/main/kotlin/com/onpa/auto_mirror_parked
          cp "$GITHUB_WORKSPACE/auto_mirror_src/android/MainActivity.kt" \
            android/app/src/main/kotlin/com/onpa/auto_mirror_parked/MainActivity.kt
          cp "$GITHUB_WORKSPACE/auto_mirror_src/android/ScreenCaptureService.kt" \
            android/app/src/main/kotlin/com/onpa/auto_mirror_parked/ScreenCaptureService.kt
          cp "$GITHUB_WORKSPACE/auto_mirror_src/android/AndroidManifest.xml" \
            android/app/src/main/AndroidManifest.xml

      - name: Get Flutter packages
        working-directory: /tmp/auto_mirror_build
        run: flutter pub get

      - name: Build release APK for ARM64
        working-directory: /tmp/auto_mirror_build
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        shell: bash
        run: |
          cp /tmp/auto_mirror_build/build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/AutoMirror-Parked-v1.0-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/AutoMirror-Parked-v1.0-arm64.apk" > \
             "$GITHUB_WORKSPACE/AutoMirror-Parked-v1.0-arm64.sha256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoMirror-Parked-v1.0-arm64
          path: |
            AutoMirror-Parked-v1.0-arm64.apk
            AutoMirror-Parked-v1.0-arm64.sha256.txt
          if-no-files-found: error
          retention-days: 7
